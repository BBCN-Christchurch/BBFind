# Disposable integration stack: actual Supabase services on standard PostgreSQL.
# No persistence, Studio, analytics or paid services. Secrets are generated per run.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:?}
    healthcheck:
      test: [CMD-SHELL, pg_isready -h 127.0.0.1 -U postgres]
      interval: 1s
      timeout: 2s
      retries: 40
  mail:
    image: axllent/mailpit:v1.22.3
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    ports:
      - "127.0.0.1:${LOCAL_MAIL_PORT:-55425}:8025"
  auth:
    image: supabase/gotrue:v2.186.0
    depends_on:
      db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: http://127.0.0.1:${LOCAL_API_PORT:-55421}
      GOTRUE_SITE_URL: http://127.0.0.1:5174
      GOTRUE_URI_ALLOW_LIST: http://127.0.0.1:5174/**
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${LOCAL_DB_PASSWORD}@db:5432/postgres
      GOTRUE_DB_NAMESPACE: auth
      GOTRUE_JWT_SECRET: ${LOCAL_JWT_SECRET:?}
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: 3600
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "false"
      GOTRUE_PASSWORD_MIN_LENGTH: 12
      GOTRUE_SMTP_ADMIN_EMAIL: noreply@bbfind.example.test
      GOTRUE_SMTP_HOST: mail
      GOTRUE_SMTP_PORT: 1025
      GOTRUE_SMTP_SENDER_NAME: BBFind local testing
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_RECOVERY: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: /auth/v1/verify
      GOTRUE_SECURITY_REFRESH_TOKEN_ROTATION_ENABLED: "true"
      GOTRUE_RATE_LIMIT_EMAIL_SENT: 100
      GOTRUE_SMTP_MAX_FREQUENCY: 1s
  rest:
    image: postgrest/postgrest:v14.3
    environment:
      PGRST_DB_URI: postgres://authenticator:${LOCAL_DB_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${LOCAL_JWT_SECRET:?}
      PGRST_DB_EXTRA_SEARCH_PATH: public,extensions
  storage:
    image: supabase/storage-api:v1.35.3
    environment:
      ANON_KEY: ${LOCAL_ANON_KEY:?}
      SERVICE_KEY: ${LOCAL_SERVICE_KEY:?}
      JWT_SECRET: ${LOCAL_JWT_SECRET:?}
      PGRST_JWT_SECRET: ${LOCAL_JWT_SECRET:?}
      POSTGREST_URL: http://rest:3000
      DATABASE_URL: postgres://postgres:${LOCAL_DB_PASSWORD}@db:5432/postgres
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      FILE_SIZE_LIMIT: 8388608
      TENANT_ID: bbfind-local
      REGION: local
      GLOBAL_S3_BUCKET: local
      ENABLE_IMAGE_TRANSFORMATION: "false"
  gateway:
    image: supabase/storage-api:v1.35.3
    entrypoint: [node, /tmp/gateway.mjs]
    ports:
      - "127.0.0.1:${LOCAL_API_PORT:-55421}:8000"
    environment:
      LOCAL_ANON_KEY: ${LOCAL_ANON_KEY:?}
  processor:
    image: supabase/edge-runtime:v1.70.0
    command: [start, --main-service, /tmp/functions/process-image]
    environment:
      SUPABASE_URL: http://gateway:8000
      SUPABASE_ANON_KEY: ${LOCAL_ANON_KEY:?}
      SUPABASE_SERVICE_ROLE_KEY: ${LOCAL_SERVICE_KEY:?}
      ALLOWED_ORIGINS: http://127.0.0.1:5174,http://127.0.0.1:5173,http://127.0.0.1:5175
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      http_proxy: ${http_proxy:-}
      https_proxy: ${https_proxy:-}
      NO_PROXY: gateway,auth,rest,storage,mail,db,localhost,127.0.0.1
      no_proxy: gateway,auth,rest,storage,mail,db,localhost,127.0.0.1
      DENO_CERT: /tmp/root-certificates.pem
